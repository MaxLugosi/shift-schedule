services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shifts
      POSTGRES_PASSWORD: shifts
      POSTGRES_DB: shifts
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shifts -d shifts"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
