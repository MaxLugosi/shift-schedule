services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shifts
      POSTGRES_PASSWORD: shifts
      POSTGRES_DB: shifts
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shifts -d shifts"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://shifts:shifts@db:5432/shifts
      PORT: 8787
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
